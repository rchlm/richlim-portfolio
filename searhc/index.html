<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Theme init: must run before CSS to prevent flash of wrong theme -->
  <script>if(localStorage.getItem('rl-theme')==='light')document.documentElement.setAttribute('data-theme','light');</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>One SEARHC Experience · Rich Lim</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="description" content="A research-led redesign of the MySEARHC patient portal for Southeast Alaska, from first stakeholder interviews to engineering handoff." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared.css" />

  <style>
    /* ─── TOKENS ─────────────────────────────────────────────────────── */
    :root {
      --bg:          #000000;
      --surface:     #111111;
      --border:      #1f1f1f;
      --border-dim:  rgba(255,255,255,0.05);
      --text:        #F4F4F0;
      --text-dim:    #a09c97;
      --text-sub:    #6b6763;
      --accent:      #B6DAC7;

      --sans:  'Inter', system-ui, sans-serif;
      --mono:  'Space Mono', 'Courier New', monospace;

      --max-w: 1600px;
      --px:    clamp(1rem, 2.5vw, 2.5rem);
    }

    /* ─── BASE ───────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      background-color: var(--bg);
      background-image: radial-gradient(ellipse 90% 60% at 50% -5%, rgba(182,218,199,0.10) 0%, rgba(182,218,199,0.03) 45%, transparent 70%);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }

    /* ─── CUSTOM CURSOR ──────────────────────────────────────────────── */
    .cursor-dot {
      position: fixed; left: -200px; top: -200px;
      width: 10px; height: 10px;
      background: var(--accent); border-radius: 50%;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%, -50%);
      will-change: left, top;
      transition: width 0.2s ease, height 0.2s ease, background 0.2s ease;
    }
    .cursor-ring {
      position: fixed; left: -200px; top: -200px;
      width: 30px; height: 30px;
      border: 1px solid rgba(182,218,199,0.3);
      border-radius: 50%;
      pointer-events: none; z-index: 9998;
      transform: translate(-50%, -50%);
      will-change: left, top;
      transition: width 0.35s ease, height 0.35s ease,
                  border-color 0.35s ease, background 0.35s ease;
    }
    .cursor-dot.is-hover { width: 16px; height: 16px; background: var(--text); }
    .cursor-ring.is-hover {
      width: 50px; height: 50px;
      border-color: rgba(182,218,199,0.15);
      background: rgba(182,218,199,0.03);
    }
    @media (hover: none), (pointer: coarse) {
      .cursor-dot, .cursor-ring { display: none; }
      body { cursor: auto; }
    }

    /* ─── ACCESSIBILITY ──────────────────────────────────────────────── */
    .skip-link {
      position: absolute; top: -100%; left: 1rem; z-index: 9999;
      padding: 0.5rem 1.25rem;
      background: var(--accent); color: var(--bg);
      font-family: var(--sans); font-size: 0.875rem; font-weight: 500;
      transition: top 0.2s;
    }
    .skip-link:focus { top: 1rem; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    :focus:not(:focus-visible) { outline: none; }

    /* ─── LAYOUT ─────────────────────────────────────────────────────── */
    .wrap { max-width: var(--max-w); margin: 0 auto; padding: 0 40px; }

    /* ─── NAV ────────────────────────────────────────────────────────── */
    .site-header {
      position: sticky; top: 0; z-index: 100;
      background: transparent;
      border-top: 1px solid rgba(255,255,255,0.07);
    }
    @media (min-width: 900px) {
      .site-header { will-change: transform; }
    }
    .nav-inner { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 0; }
    .wordmark { display: flex; align-items: center; }
    .wordmark img { height: 2.75rem; width: auto; }
    .nav-links { display: flex; align-items: center; gap: 2.5rem; }
    .nav-links a {
      font-family: var(--mono); font-size: 0.8125rem;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-dim); transition: color 0.15s;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-links a[aria-current="page"] {
      color: var(--text);
      text-decoration: underline;
      text-decoration-color: var(--accent);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }
    .nav-ext { display: inline-flex; align-items: baseline; gap: 0.2em; }
    .nav-ext-icon { font-size: 0.75em; line-height: 1; color: var(--text-dim); transition: color 0.15s; }
    .nav-links a:hover .nav-ext-icon { color: var(--text); }
    .nav-links .nav-cta {
      color: var(--text);
      background: transparent;
      border-color: rgba(182, 218, 199, 0.35);
    }

    body.js-cursor { cursor: none; }
    body.js-cursor .nav-toggle { cursor: none; }

    /* ─── HAMBURGER ──────────────────────────────────────────────────── */
    .nav-toggle {
      display: none; flex-direction: column; justify-content: center;
      gap: 5px; width: 40px; height: 40px;
      background: none; border: none; padding: 0.5rem; cursor: pointer;
      z-index: 9997; position: relative; flex-shrink: 0;
    }
    .hamburger-line {
      display: block; width: 20px; height: 1.5px;
      background: var(--text); border-radius: 1px; transform-origin: center;
      transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.2s ease;
    }
    .nav-toggle.is-open .hamburger-line:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .nav-toggle.is-open .hamburger-line:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .nav-toggle.is-open .hamburger-line:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

    /* ─── BACK LINK ──────────────────────────────────────────────────── */
    .cs-back-btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-family: var(--mono); font-size: 0.6875rem;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--text-dim); transition: color 0.15s;
      margin-bottom: 2.5rem;
    }
    .cs-back-btn:hover { color: var(--text); }

    /* ─── SCROLL REVEAL ──────────────────────────────────────────────── */
    @media (prefers-reduced-motion: no-preference) {
      .fade { opacity: 0; transform: translateY(22px); transition: opacity 0.7s ease, transform 0.7s ease; }
      .fade.visible { opacity: 1; transform: none; }
    }

    /* ─── IMAGE PLACEHOLDER ──────────────────────────────────────────── */
    .placeholder {
      background: var(--surface); position: relative; overflow: hidden;
    }
    .placeholder::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.016) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.016) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }
    .placeholder-lbl {
      position: absolute; bottom: 1.25rem; left: 1.25rem;
      font-family: var(--mono); font-size: 0.5625rem;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--text-sub);
    }

    /* ─── CASE STUDY HERO ────────────────────────────────────────────── */
    .cs-hero { padding-bottom: 0; }
    .cs-hero-inner { position: relative; }
    .cs-hero-head {
      display: flex; flex-direction: column;
      align-items: flex-start; gap: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .cs-hero-title {
      font-family: var(--sans);
      font-size: clamp(2.625rem, 6.5vw, 5.5rem);
      font-weight: 500; line-height: 1;
      letter-spacing: -0.035em; color: var(--text);
    }
    .cs-hero-title em { font-style: normal; color: var(--text); }
    .cs-hero-logo { height: 32px; width: auto; display: block; }
    @media (max-width: 640px) { .cs-hero-logo { height: 24px; } }
    .cs-hero-subtitle {
      font-size: clamp(1rem, 1.5vw, 1.125rem);
      line-height: 1.7; color: var(--text);
      max-width: 560px;
      margin-bottom: clamp(2rem, 5vh, 4rem);
    }

    /* ─── HERO IMAGE ─────────────────────────────────────────────────── */
    .cs-hero-image { width: 100%; overflow: hidden; }
    .cs-hero-image img { width: 100%; height: auto; display: block; }

    /* ─── META BAR ───────────────────────────────────────────────────── */
    .cs-meta {
      position: sticky; top: 0; z-index: 101;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .cs-meta-inner { display: grid; grid-template-columns: repeat(4, 1fr); }
    .cs-meta-item {
      padding: clamp(1.5rem, 3vh, 2.25rem) clamp(1rem, 2vw, 1.5rem);
      display: flex; flex-direction: column; gap: 0.5rem;
      align-items: center; text-align: center;
    }
    .cs-meta-item + .cs-meta-item { border-left: 1px solid var(--border); }
    .cs-meta-label {
      font-family: var(--mono); font-size: 0.6875rem;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-dim);
    }
    .cs-meta-value {
      font-family: var(--sans); font-size: 0.875rem;
      font-weight: 400; line-height: 1.3; color: var(--text);
    }

    /* ─── BODY LAYOUT ────────────────────────────────────────────────── */
    .cs-body {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: clamp(4rem, 8vw, 8rem);
      align-items: start;
      padding-top: clamp(4rem, 8vh, 7rem);
      padding-bottom: clamp(4rem, 8vh, 7rem);
    }

    /* ─── SIDEBAR ────────────────────────────────────────────────────── */
    .cs-sidebar { position: sticky; top: 6rem; }
    .cs-sidebar-section { display: flex; flex-direction: column; gap: 0.875rem; }
    .cs-sidebar-section + .cs-sidebar-section {
      margin-top: 2.5rem; padding-top: 0;
    }
    .cs-sidebar-label {
      font-family: var(--mono); font-size: 0.6875rem;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--text-dim);
    }
    .cs-sidebar-text { font-size: 0.875rem; line-height: 1.75; color: var(--text); }
    .cs-sidebar-role { font-size: 0.875rem; color: var(--text); }

    /* ─── MAIN CONTENT ───────────────────────────────────────────────── */
    .cs-content {
      display: flex; flex-direction: column;
      gap: clamp(4rem, 9vh, 7rem); min-width: 0;
    }
    .cs-section { display: flex; flex-direction: column; gap: 2.5rem; }
    .cs-section-label {
      font-family: var(--mono); font-size: 0.6875rem;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--text-dim);
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .cs-pullquote {
      font-family: var(--sans);
      font-size: clamp(1.25rem, 2.25vw, 1.875rem);
      font-weight: 500; font-style: normal;
      line-height: 1.3; letter-spacing: -0.02em; color: var(--text);
    }
    .cs-pullquote-box {
      background: var(--surface);
      border-left: 3px solid var(--accent);
      border-radius: 0 10px 10px 0;
      padding: 2.25rem 2.25rem;
    }

    /* ─── WHAT WE DID CARDS ──────────────────────────────────────────── */
    .cs-work-grid {
      display: flex; gap: 1.25rem;
      overflow-x: auto;
      padding-top: 0.25rem; padding-bottom: 0.5rem;
      padding-left: 0; padding-right: 2rem;
      scroll-snap-type: x mandatory;
      scrollbar-width: none; -ms-overflow-style: none;
    }
    .cs-work-grid::-webkit-scrollbar { display: none; }
    .cs-work-card {
      flex: 0 0 clamp(240px, 26vw, 300px);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem 2rem 2.25rem;
      scroll-snap-align: start;
    }
    .cs-work-card-num {
      font-family: var(--mono);
      font-size: clamp(2rem, 3.5vw, 3rem);
      font-weight: 400; line-height: 1;
      letter-spacing: -0.03em; color: var(--text-sub);
      margin-bottom: 1.75rem;
    }
    .cs-work-card-title {
      font-family: var(--sans); font-size: clamp(1rem, 1.5vw, 1.125rem);
      font-weight: 500; letter-spacing: -0.02em; margin-bottom: 0.875rem;
      color: var(--text);
    }
    .cs-work-card-desc {
      font-family: var(--sans); font-size: 0.9375rem;
      line-height: 1.7; color: var(--text-dim);
    }

    /* ─── CARD GRID 2×2 ─────────────────────────────────────────────── */
    .cs-card-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.25rem;
    }
    @media (max-width: 1100px) {
      .cs-card-grid { grid-template-columns: 1fr; }
    }
    .cs-work-card--full { flex: none; }

    /* ─── IN-CONTENT IMAGE ───────────────────────────────────────────── */
    .cs-image { width: 100%; border-radius: 12px; overflow: hidden; }
    .cs-image img { width: 100%; height: auto; display: block; }

    /* ─── PAGINATION ─────────────────────────────────────────────────── */
    .cs-pagination { border-top: 1px solid var(--border); }
    .cs-pagination-inner { display: grid; grid-template-columns: 1fr 1fr; min-height: 140px; }
    .cs-pag-item {
      display: flex; flex-direction: column; justify-content: center;
      padding: clamp(2rem, 4vh, 3rem) 0; gap: 0.625rem;
    }
    .cs-pag-item + .cs-pag-item {
      border-left: 1px solid var(--border);
      padding-left: clamp(1.5rem, 3vw, 3rem);
      align-items: flex-end; text-align: right;
      transition: border-color 0.2s ease;
    }
    .cs-pag-item + .cs-pag-item:hover { border-left-color: var(--accent); }
    .cs-pag-direction {
      font-family: var(--mono); font-size: 0.6875rem;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--text-dim);
      display: flex; align-items: center; gap: 0.5rem;
      transition: color 0.2s ease;
    }
    .cs-pag-item:last-child .cs-pag-direction { justify-content: flex-end; }
    .cs-pag-title {
      font-family: var(--sans);
      font-size: clamp(1rem, 2vw, 1.375rem);
      font-weight: 500; letter-spacing: -0.02em;
      color: var(--text); transition: color 0.2s ease;
    }
    .cs-pag-sub { font-size: 0.875rem; color: var(--text-dim); transition: color 0.2s ease; }
    .cs-pag-item:hover .cs-pag-title { color: var(--accent); }

    /* ─── MOBILE ─────────────────────────────────────────────────────── */
    @media (max-width: 900px) {
      .cs-body { grid-template-columns: 1fr; gap: clamp(3rem, 6vh, 5rem); }
      .cs-sidebar { position: static; }
      .cs-sidebar-section + .cs-sidebar-section {
        display: grid; grid-template-columns: 1fr 1fr;
        align-items: start; gap: 1rem;
        margin-top: 0; padding-top: 1.25rem;
        border-top: 1px solid var(--border);
      }
      .cs-sidebar-section:first-child {
        display: grid; grid-template-columns: 1fr 1fr;
        align-items: start; gap: 1rem;
      }
    }
    @media (max-width: 768px) {
      .wrap { padding: 0 20px; }
      .wordmark img { height: 2.25rem; }
      .nav-ext-secondary { display: none; }
      .nav-links { gap: 1.75rem; }
      .cs-meta { position: static; }
      .cs-back-btn { margin-top: 1.5rem; display: block; }
      .cs-pagination { margin-top: 2rem; }
      .cs-meta-inner { grid-template-columns: repeat(2, 1fr); }
      .cs-meta-item:nth-child(3) { border-left: none; }
      .cs-meta-item:nth-child(3),
      .cs-meta-item:nth-child(4) { border-top: 1px solid var(--border); }
    }
    @media (max-width: 640px) {
      .nav-toggle { display: flex; }
      #nav-menu {
        position: fixed; inset: 0;
        background: var(--bg);
        flex-direction: column; align-items: center; justify-content: center;
        gap: 2rem; z-index: 9996;
        opacity: 0; pointer-events: none;
        transition: opacity 0.3s ease;
      }
      #nav-menu.is-open { opacity: 1; pointer-events: auto; }
      #nav-menu a { font-size: 1.125rem; letter-spacing: 0.04em; }
      #nav-menu li.nav-ext-secondary { display: block; }
      #nav-menu .nav-cta { padding: 0.875rem 2rem; font-size: 0.875rem; }
      body.nav-is-open { overflow: hidden; }
      .cs-hero-title { font-size: clamp(3rem, 12vw, 4.5rem); }
      .cs-hero-image img { aspect-ratio: 3 / 4; object-fit: cover; object-position: center top; }
      .cs-image img { aspect-ratio: 3 / 4; object-fit: cover; object-position: center top; }
      .cs-sidebar-section,
      .cs-sidebar-section + .cs-sidebar-section,
      .cs-sidebar-section:first-child { display: flex; flex-direction: column; gap: 0.75rem; }
      .cs-sidebar-section + .cs-sidebar-section { border-top: 1px solid var(--border); padding-top: 1.25rem; }
      .cs-work-card { flex: 0 0 min(280px, 80vw); }
    }
    @media (max-width: 500px) {
      .cs-meta-inner { grid-template-columns: 1fr 1fr; }
      .cs-pagination-inner { grid-template-columns: 1fr; }
      .cs-pag-item + .cs-pag-item {
        border-left: none; border-top: 1px solid var(--border);
        padding-left: 0; align-items: flex-start; text-align: left;
      }
      .cs-pag-item:last-child .cs-pag-direction { justify-content: flex-start; }
    }

    /* ─── WORK PHASE GROUPS ─────────────────────────────────────────── */
    .cs-work-phase-group { display: flex; flex-direction: column; gap: 1.25rem; }
    .cs-work-phase-group + .cs-work-phase-group { margin-top: 2.5rem; }
    .cs-work-phase-label {
      font-family: var(--mono); font-size: 0.6875rem;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--text-dim);
    }

    /* ─── PLAIN WORK ITEMS ──────────────────────────────────────────── */
    .cs-work-list { display: flex; flex-direction: column; gap: 2.25rem; }
    .cs-work-item { display: flex; flex-direction: column; gap: 0.875rem; }
    .cs-work-item-num {
      font-family: var(--mono);
      font-size: clamp(2rem, 3.5vw, 3rem);
      font-weight: 400; line-height: 1;
      letter-spacing: -0.03em; color: var(--text-sub);
    }
    .cs-work-item-title {
      font-family: var(--sans); font-size: clamp(1rem, 1.5vw, 1.125rem);
      font-weight: 500; letter-spacing: -0.02em; color: var(--text);
    }
    .cs-work-item-desc {
      font-family: var(--sans); font-size: 0.9375rem;
      line-height: 1.7; color: var(--text-dim);
    }

    /* ─── SECTION HEADING ───────────────────────────────────────────── */
    .cs-section-heading {
      font-family: var(--sans); font-size: clamp(1.125rem, 1.75vw, 1.375rem);
      font-weight: 500; letter-spacing: -0.025em; color: var(--text);
    }

    /* ─── PASSWORD GATE ──────────────────────────────────────────────── */
    .cs-gate { max-width: 480px; padding-bottom: clamp(3rem, 8vh, 5rem); }
    .cs-gate-eyebrow {
      font-family: var(--mono); font-size: 0.5625rem;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 0.75rem;
    }
    .cs-gate-helper {
      font-size: 0.9375rem; line-height: 1.65;
      color: var(--text-dim); margin-bottom: 1.75rem;
    }
    .cs-gate-form { display: flex; flex-direction: column; gap: 0.625rem; }
    .cs-gate-row { display: flex; gap: 0.625rem; align-items: stretch; }
    .cs-gate-input-wrap { position: relative; display: flex; align-items: center; flex: 1; }
    .cs-gate-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--sans); font-size: 0.9375rem;
      padding: 0.8125rem 3rem 0.8125rem 1rem;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    .cs-gate-input:focus { border-color: rgba(182,218,199,0.6); }
    .cs-gate-input.is-error { border-color: rgba(248,113,113,0.6); }
    .cs-gate-toggle {
      position: absolute; right: 0.75rem;
      background: none; border: none; padding: 0.3rem;
      color: var(--text-dim); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color 0.15s; border-radius: 4px;
    }
    .cs-gate-toggle:hover { color: var(--text); }
    .cs-gate-error {
      font-family: var(--sans); font-size: 0.875rem;
      line-height: 1.4; color: #f87171;
    }
    .cs-gate-submit {
      flex-shrink: 0;
      color: var(--text);
      background: transparent;
      border: 1px solid rgba(182, 218, 199, 0.35);
      font-family: var(--mono); font-size: 0.8125rem;
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 0.75rem 1.4rem; border-radius: 6px;
      cursor: pointer; white-space: nowrap;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }
    .cs-gate-submit:hover:not(:disabled) {
      background: #B6DAC7; color: #000; border-color: #B6DAC7;
    }
    .cs-gate-submit:disabled { opacity: 0.5; cursor: default; }
    .cs-gate-access {
      font-size: 0.875rem; color: var(--text-dim);
      margin-top: 1.5rem;
    }
    .cs-gate-access a {
      color: var(--text);
      text-decoration: underline;
      text-decoration-color: rgba(182,218,199,0.5);
      text-underline-offset: 2px;
      transition: color 0.15s, text-decoration-color 0.15s;
    }

  <!-- ═══════════════════════════════════════════════════════
       FOOTER
  ═══════════════════════════════════════════════════════ -->
  <footer class="site-footer" id="site-footer" role="contentinfo"></footer>

  <script src="/prefooter.js"></script>
  <script src="/footer.js"></script>
  <script>
    /* ─── SVG ICONS ─────────────────────────────────────── */
    var EYE_SHOW = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    var EYE_HIDE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

    /* ─── CUSTOM CURSOR ─────────────────────────────────── */
    var dot  = document.querySelector('.cursor-dot');
    var ring = document.querySelector('.cursor-ring');
    var hasFinePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

    function addHoverListeners(root) {
      if (!hasFinePointer || !dot || !ring) return;
      root.querySelectorAll('a, button, [role="button"], input, select, textarea').forEach(function (el) {
        el.addEventListener('mouseenter', function () { dot.classList.add('is-hover'); ring.classList.add('is-hover'); });
        el.addEventListener('mouseleave', function () { dot.classList.remove('is-hover'); ring.classList.remove('is-hover'); });
      });
    }

    if (dot && ring && hasFinePointer) {
      document.body.classList.add('js-cursor');
      var mx = -200, my = -200, rx = -200, ry = -200;
      document.addEventListener('mousemove', function (e) { mx = e.clientX; my = e.clientY; });
      function lerp(a, b, t) { return a + (b - a) * t; }
      (function loop() {
        dot.style.left = mx + 'px'; dot.style.top = my + 'px';
        rx = lerp(rx, mx, 0.12); ry = lerp(ry, my, 0.12);
        ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
        requestAnimationFrame(loop);
      })();
      addHoverListeners(document);
    }

    /* ─── STICKY META / PUSH NAV ────────────────────────── */
    function initMetaNav() {
      var header  = document.querySelector('.site-header');
      var metaBar = document.querySelector('.cs-meta');
      var sidebar = document.querySelector('.cs-sidebar');
      if (!header || !metaBar) return;

      function setSidebarTop() {
        if (sidebar) sidebar.style.top = (metaBar.offsetHeight + 24) + 'px';
      }
      setSidebarTop();
      window.addEventListener('resize', setSidebarTop, { passive: true });

      if (!window.matchMedia('(min-width: 900px)').matches) return;
      var navH = header.offsetHeight;
      function pushNav() {
        var top = metaBar.getBoundingClientRect().top;
        if (top > navH)      header.style.transform = '';
        else if (top >= 0)   header.style.transform = 'translateY(' + (-(navH - top) / navH * navH) + 'px)';
        else                 header.style.transform = 'translateY(-' + navH + 'px)';
      }
      window.addEventListener('scroll', pushNav, { passive: true });
      pushNav();
    }
    initMetaNav();

    /* ─── SCROLL REVEAL ─────────────────────────────────── */
    var fadeObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('visible'); fadeObserver.unobserve(e.target); }
      });
    }, { threshold: 0.08 });
    document.querySelectorAll('.fade').forEach(function (el) { fadeObserver.observe(el); });

    /* ─── PASSWORD GATE ─────────────────────────────────── */
    (function () {
      var gate   = document.getElementById('cs-gate');
      var form   = document.getElementById('cs-gate-form');
      var input  = document.getElementById('cs-pw-input');
      var submit = document.getElementById('cs-gate-submit');
      var errEl  = document.getElementById('cs-gate-error');
      var toggle = document.getElementById('cs-pw-toggle');
      var gated  = document.getElementById('cs-gated-content');

      /* Inject initial eye icon */
      if (toggle) toggle.innerHTML = EYE_SHOW;

      function revealContent(html) {
        gate.style.display = 'none';
        gated.innerHTML = html;
        gated.style.display = 'block';
        gated.style.opacity = '0';
        gated.style.transition = 'opacity 0.7s ease';

        var heroUnlocked = gated.querySelector('#cs-hero-unlocked');
        var heroInner = document.querySelector('.cs-hero-inner');
        if (heroUnlocked && heroInner) {
          heroUnlocked.style.opacity = '0';
          heroUnlocked.style.transition = 'opacity 0.7s ease';
          heroInner.insertBefore(heroUnlocked, gate);
        }

        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            gated.style.opacity = '1';
            if (heroUnlocked) heroUnlocked.style.opacity = '1';
          });
        });

        setTimeout(function () {
          var title = document.getElementById('cs-title');
          if (title) { title.focus(); }
        }, 150);

        gated.querySelectorAll('.fade').forEach(function (el) { fadeObserver.observe(el); });
        addHoverListeners(gated);
        initMetaNav();
      }

      async function attemptDecrypt(pw) {
        var payloadEl = document.getElementById('cs-payload');
        if (!payloadEl) return false;
        var p;
        try { p = JSON.parse(payloadEl.textContent); } catch (e) { return false; }
        if (!p.s || !p.i || !p.d) return false;

        function fromB64(str) {
          return Uint8Array.from(atob(str), function (c) { return c.charCodeAt(0); });
        }

        var salt = fromB64(p.s);
        var iv   = fromB64(p.i);
        var data = fromB64(p.d);
        var subtle = window.crypto.subtle;
        var enc = new TextEncoder();

        try {
          var km  = await subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
          var key = await subtle.deriveKey(
            { name: 'PBKDF2', hash: 'SHA-256', salt: salt, iterations: 200000 },
            km,
            { name: 'AES-GCM', length: 256 },
            false,
            ['decrypt']
          );
          var plain = await subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, data);
          return new TextDecoder().decode(plain);
        } catch (e) {
          return false;
        }
      }

      /* Session check */
      var cached = null;
      try { cached = sessionStorage.getItem('searhc-content'); } catch (e) {}

      if (cached) {
        revealContent(cached);
        return;
      }

      /* Show gate */
      gate.style.display = 'block';

      /* Show/hide toggle */
      if (toggle) {
        toggle.addEventListener('click', function () {
          var show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          toggle.setAttribute('aria-pressed', show ? 'true' : 'false');
          toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
          toggle.innerHTML = show ? EYE_HIDE : EYE_SHOW;
        });
      }

      /* Submit */
      if (form) {
        form.addEventListener('submit', async function (e) {
          e.preventDefault();
          var pw = input.value;
          if (!pw) { input.focus(); return; }

          errEl.hidden = true;
          input.classList.remove('is-error');
          submit.disabled = true;
          submit.textContent = 'Verifying…';

          var html = await attemptDecrypt(pw);

          if (html === false) {
            errEl.textContent = "That password isn’t right. Try again.";
            errEl.hidden = false;
            input.value = '';
            input.classList.add('is-error');
            submit.disabled = false;
            submit.textContent = 'View Case Study';
            input.focus();
            return;
          }

          try { sessionStorage.setItem('searhc-content', html); } catch (e) {}
          revealContent(html);
        });
      }
    })();
  </script>
